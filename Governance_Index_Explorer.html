<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Governance Index Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#64708a;--pri:#2563eb;--bd:#dde3ef;--ok:#dcfce7;--acc:#1e3a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,'Noto Sans Thai',system-ui,sans-serif;line-height:1.5}
header{background:linear-gradient(120deg,#0f172a,#1e3a8a 55%,#0d9488);color:#fff;padding:22px 16px}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}
header .wrap{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem}header p{margin:2px 0 0;opacity:.9}
main{padding:18px 0 50px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
button,select,input{font:inherit}
.btn{border:0;border-radius:9px;padding:8px 14px;cursor:pointer;background:var(--pri);color:#fff;font-weight:600}
.btn.sec{background:#e8edf7;color:var(--ink)}.btn.warn{background:#ef4444}.btn.ok{background:#16a34a}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:default}
.lang{display:flex;border-radius:9px;overflow:hidden;border:1px solid #fff8}
.lang button{background:transparent;color:#fff;border:0;padding:6px 14px;cursor:pointer}
.lang button.on{background:#fff;color:#1e3a8a;font-weight:700}
/* index picker */
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:900px){.picker{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.picker{grid-template-columns:1fr}}
.ix{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);transition:.15s}
.ix:hover{border-color:#93b4f5;transform:translateY(-1px)}
.ix .ic{font-size:1.5rem;line-height:1}.ix b{font-size:1rem}.ix small{color:var(--mut);font-size:.8rem}
.ix.on{border-color:var(--c,#2563eb);background:color-mix(in srgb,var(--c,#2563eb) 9%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#2563eb) 18%,transparent)}
.about{margin-top:14px;padding:12px 14px;border-radius:10px;background:#f6f8fd;border-left:5px solid var(--c,#2563eb)}
.about h2{margin:0 0 4px;font-size:1.1rem}.about p{margin:2px 0;color:#334155;font-size:.93rem}.about a{color:var(--pri)}
.dir{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:700;margin-left:6px;vertical-align:middle}
.dir.up{background:#dcfce7;color:#166534}.dir.down{background:#fee2e2;color:#991b1b}
/* data panel */
.dpanel{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.dpanel select{padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.dpanel label,.cyl{display:flex;gap:6px;align-items:center;font-size:.92rem;color:var(--mut)}
.dpanel a{color:var(--pri);font-size:.9rem}
.dstat{margin-top:10px;padding:9px 12px;border-radius:9px;background:#eef2fa;font-size:.93rem}
.dstat.good{background:#ecfdf3;color:#14532d}.dstat.warn{background:#fff7e6;color:#7c4a03}
.dstat small{display:block;opacity:.85;word-break:break-word}.dstat .new{font-weight:700;margin-top:4px}
/* search */
.sbox{position:relative}
#q{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;font-size:1.05rem}
#q:focus{outline:0;border-color:var(--pri)}#q:disabled{background:#f1f3f8}
#dd{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--bd);border-radius:10px;max-height:320px;overflow:auto;box-shadow:0 8px 24px #0002;display:none}
#dd div{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#dd div:hover,#dd div.hl{background:#eaf1ff}#dd small{color:var(--mut)}#dd .on{font-weight:700;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#eaf1ff;border:1px solid #bcd0fb;border-radius:99px;padding:3px 6px 3px 12px;display:flex;gap:6px;align-items:center}
.chip b{cursor:pointer;background:#c9d9fb;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:.8rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar .g{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border:1px solid var(--bd);padding:7px 12px;text-align:right;white-space:nowrap}
th{background:#1e3a8a;color:#fff}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#f1f5fd;color:var(--ink);font-weight:600}
th:first-child{background:#1e3a8a;color:#fff}
td.best{background:var(--ok);font-weight:700}
tr.sec td{background:#1e3a8a14!important;color:#1e3a8a;font-weight:700;text-align:left;position:static}
.cyl select,.ctl .xs{padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-weight:600}
.cap{color:var(--mut);font-size:.93rem;margin:10px 0 0}
.empty{text-align:center;color:var(--mut);padding:30px}
/* charts */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.ch h3{margin:0 0 2px;font-size:1.05rem}.ch p{margin:0 0 8px;color:var(--mut);font-size:.88rem}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:.9rem}
.ctl select,.ctl input{padding:4px 6px;border:1px solid var(--bd);border-radius:7px}.ctl input{width:56px}
.cv{position:relative;height:380px}
</style>
</head>
<body>
<header><div class="wrap">
<div><h1 data-i="title"></h1><p data-i="sub"></p></div>
<div class="lang"><button id="bth">ไทย</button><button id="ben">English</button></div>
</div></header>
<main class="wrap">
<section class="card">
<div class="picker" id="picker"></div>
<div class="about" id="about"></div>
</section>
<section class="card">
<div class="dpanel">
<button class="btn" id="bup" data-i="upd"></button>
<button class="btn sec" id="bimp" data-i="imp"></button><input type="file" id="dfile" accept=".csv,.json,.xlsx,.xls" hidden>
<a id="dl" target="_blank" rel="noopener"></a>
<label><span data-i="yv"></span><select id="dym"></select></label>
</div>
<div class="dstat" id="dstat"></div>
</section>
<section class="card">
<div class="sbox"><input id="q" autocomplete="off"><div id="dd"></div></div>
<div class="chips" id="chips"></div>
<div class="bar" style="margin:14px 0 0">
<div class="g"><button class="btn" id="bch" data-i="showCh"></button></div>
<button class="btn warn" id="brs" data-i="reset"></button>
</div>
</section>
<section class="card" id="tcard">
<div class="bar"><h2 style="margin:0;font-size:1.2rem" id="tTitle"></h2>
<div class="g"><label class="cyl" id="cyl"><span data-i="cyL"></span><select id="cyr"></select></label><button class="btn ok" id="bxl" data-i="xl"></button></div></div>
<div class="tw" id="tbl"></div>
<p class="cap" id="cap"></p>
</section>
<section id="charts" style="display:none"><div class="grid" id="grid"></div></section>
<p class="cap" id="srcnote"></p>
</main>
<script>
/* =====================================================================
   GOVERNANCE INDEX EXPLORER — ดึงข้อมูลจริงจากฐานข้อมูลออนไลน์และอัปเดตอัตโนมัติ
   แต่ละดัชนีกำหนดไว้ใน IDX ด้านล่าง: แหล่งข้อมูลหลัก (main) + ตัวชี้วัดองค์ประกอบ/ตัวชี้วัดเสริม (comps)
     t:'owid' = CSV จาก Our World in Data grapher (เปิด CORS)
     t:'wb'   = World Bank API (JSON)
     t:'file' = ต้องนำเข้าไฟล์เอง (KOF ไม่มี API สาธารณะ)
   แคชในเบราว์เซอร์ 24 ชม. และตรวจสอบข้อมูลใหม่ทุก 6 ชม. ขณะเปิดหน้า
   ===================================================================== */
const NOW=new Date().getFullYear();
const OW=s=>`https://ourworldindata.org/grapher/${s}.csv?v=1&csvType=full&useColumnShortNames=false`;
const WB=c=>`https://api.worldbank.org/v2/country/all/indicator/${c}?format=json&per_page=20000&date=1996:${NOW}`;
const IDX={
 transparency:{ic:'🔍',col:'#0891b2',min:0,max:100,dec:0,hb:true,y0:2012,
  th:'ดัชนีความโปร่งใส',en:'Transparency Index',
  full:{th:'ดัชนีการรับรู้การทุจริต (Corruption Perceptions Index, CPI) — Transparency International',en:'Corruption Perceptions Index (CPI) — Transparency International'},
  desc:{th:'วัดระดับความโปร่งใสและความสะอาดของภาครัฐตามการรับรู้ของผู้เชี่ยวชาญและภาคธุรกิจ คะแนน 0–100: 100 = โปร่งใส/สะอาดมาก, 0 = ทุจริตสูงมาก',en:'Perceived transparency and cleanliness of the public sector according to experts and business people. Score 0–100: 100 = very clean, 0 = highly corrupt.'},
  src:{n:'Transparency International (ผ่าน Our World in Data)',ne:'Transparency International (via Our World in Data)',url:'https://www.transparency.org/en/cpi'},
  main:{t:'owid',u:OW('ti-corruption-perception-index')},
  comps:[
   {k:'va',th:'เสียงของประชาชนและความรับผิดชอบ (WGI, 0–100)',en:'Voice & Accountability (WGI score, 0–100)',t:'wb',u:WB('GOV_WGI_VA_SC'),dec:1,hb:true,min:0,max:100},
   {k:'cc',th:'การควบคุมการทุจริต (WGI, 0–100)',en:'Control of Corruption (WGI score, 0–100)',t:'wb',u:WB('GOV_WGI_CC_SC'),dec:1,hb:true,min:0,max:100},
   {k:'rq',th:'คุณภาพของกฎระเบียบ (WGI, 0–100)',en:'Regulatory Quality (WGI score, 0–100)',t:'wb',u:WB('GOV_WGI_RQ_SC'),dec:1,hb:true,min:0,max:100}]},
 corruption:{ic:'⚖️',col:'#dc2626',min:0,max:1,dec:3,hb:false,y0:1990,
  th:'ดัชนีการคอร์รัปชัน',en:'Corruption Index',
  full:{th:'ดัชนีคอร์รัปชันทางการเมือง (Political Corruption Index) — V-Dem',en:'Political Corruption Index — V-Dem'},
  desc:{th:'วัดระดับคอร์รัปชันในฝ่ายบริหาร ฝ่ายนิติบัญญัติ ฝ่ายตุลาการ และภาครัฐ ค่า 0–1: ยิ่งสูงยิ่งคอร์รัปชันมาก (ค่าต่ำ = ดี)',en:'Corruption across the executive, legislature, judiciary and public sector. Scale 0–1: higher = more corrupt (lower is better).'},
  src:{n:'V-Dem (ผ่าน Our World in Data)',ne:'V-Dem (via Our World in Data)',url:'https://v-dem.net/data/the-v-dem-dataset/'},
  main:{t:'owid',u:OW('political-corruption-index')},
  comps:[
   {k:'ex',th:'ดัชนีคอร์รัปชันฝ่ายบริหาร (V-Dem, 0–1)',en:'Executive corruption index (V-Dem, 0–1)',t:'owid',u:OW('executive-corruption-index'),dec:3,hb:false,min:0,max:1},
   {k:'ps',th:'ดัชนีคอร์รัปชันภาครัฐ (V-Dem, 0–1)',en:'Public sector corruption index (V-Dem, 0–1)',t:'owid',u:OW('public-sector-corruption-index'),dec:3,hb:false,min:0,max:1},
   {k:'cc',th:'การควบคุมการทุจริต (WGI, 0–100)',en:'Control of Corruption (WGI score, 0–100)',t:'wb',u:WB('GOV_WGI_CC_SC'),dec:1,hb:true,min:0,max:100}]},
 stability:{ic:'🏛️',col:'#7c3aed',min:0,max:100,dec:1,hb:true,y0:1996,
  th:'ความมั่นคงของรัฐบาล',en:'Government Stability',
  full:{th:'เสถียรภาพทางการเมืองและการไม่มีความรุนแรง/การก่อการร้าย — Worldwide Governance Indicators (ธนาคารโลก)',en:'Political Stability and Absence of Violence/Terrorism — Worldwide Governance Indicators (World Bank)'},
  desc:{th:'วัดความเป็นไปได้ที่รัฐบาลจะถูกบั่นทอนหรือโค่นล้มด้วยวิธีที่ไม่ชอบด้วยกฎหมายหรือความรุนแรง คะแนน 0–100: ยิ่งสูงยิ่งมั่นคง',en:'Likelihood that the government will be destabilised or overthrown by unconstitutional or violent means. Score 0–100: higher = more stable.'},
  src:{n:'World Bank Worldwide Governance Indicators',ne:'World Bank Worldwide Governance Indicators',url:'https://www.worldbank.org/en/publication/worldwide-governance-indicators'},

   {k:'ge',th:'ประสิทธิผลของรัฐบาล (WGI, 0–100)',en:'Government Effectiveness (WGI score, 0–100)',t:'wb',u:WB('GOV_WGI_GE_SC'),dec:1,hb:true,min:0,max:100},

  desc:{th:'วัดระดับการเชื่อมโยงกับโลกใน 3 มิติ: เศรษฐกิจ สังคม และการเมือง คะแนน 0–100: ยิ่งสูงยิ่งเป็นโลกาภิวัตน์มาก — KOF ไม่มี API สาธารณะ จึงต้องดาวน์โหลดไฟล์ข้อมูล (.xlsx) จากเว็บ KOF แล้วกด "นำเข้าไฟล์" (ทำครั้งเดียว ระบบจะจำไว้)',en:'Degree of global integration across economic, social and political dimensions. Score 0–100: higher = more globalised — KOF has no public API, so download the data file (.xlsx) from KOF and press "Import file" (once; it is remembered).'},
  src:{n:'KOF Swiss Economic Institute',ne:'KOF Swiss Economic Institute',url:'https://www.kof.ethz.ch/en/forecasts-and-indicators/indicators/kof-globalisation-index.html'},
  main:{t:'file',col:'KOFGI'},
  comps:[
   {k:'KOFEcGI',th:'โลกาภิวัตน์ด้านเศรษฐกิจ (0–100)',en:'Economic globalisation (0–100)',t:'file',dec:1,hb:true,min:0,max:100},
   {k:'KOFSoGI',th:'โลกาภิวัตน์ด้านสังคม (0–100)',en:'Social globalisation (0–100)',t:'file',dec:1,hb:true,min:0,max:100},
   {k:'KOFPoGI',th:'โลกาภิวัตน์ด้านการเมือง (0–100)',en:'Political globalisation (0–100)',t:'file',dec:1,hb:true,min:0,max:100},

  th:'ดัชนีองค์กรประชาสังคม',en:'Civil Society Organization Index',
  full:{th:'ดัชนีประชาสังคมหลัก (Core Civil Society Index, CCSI) — V-Dem',en:'Core Civil Society Index (CCSI) — V-Dem'},

   {k:'fa',th:'ดัชนีเสรีภาพในการรวมกลุ่ม (V-Dem, 0–1)',en:'Freedom of association index (V-Dem, 0–1)',t:'owid',u:OW('freedom-of-association-index'),dec:3,hb:true,min:0,max:1}]}

/* ---------- parsing ---------- */
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');const out=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'){row.push(f);out.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);out.push(row)}
  return out.filter(r=>r.length>1||r[0]);
}
const num=s=>{if(s==null||s==='')return null;const v=+s;return isFinite(v)?v:null};
/* entity: {n, iso3, c(ISO2|''), ct(country?), s:{slot:{year:value}}} */
function put(M,name,code,ct,year,val,slot){
  code=(code||'').trim();name=String(name||code).trim();
  if(code==='OWID_WRL'){code='';ct=false;name='World'}
  const c=I32[code]||'';
  if(!ct)name=name.replace(/\s*\([^)]*\)\s*$/,'').trim();
  const k=ct?(code||name):'G:'+name;
  const e=M.get(k)||{n:name,iso3:code,c,ct,s:{}};
  if(year!=null&&val!=null&&isFinite(year))(e.s[slot]||(e.s[slot]={}))[year]=val;
  M.set(k,e);
}
function fromOWID(R,M,slot){
  const h=R[0].map(s=>s.toLowerCase().trim());
  const iE=h.indexOf('entity'),iC=h.indexOf('code'),iY=h.indexOf('year');
  const iV=h.findIndex((s,i)=>i!==iE&&i!==iC&&i!==iY&&!/annotation|region|owid_region/.test(s));
  if(iE<0||iY<0||iV<0)throw new Error('OWID CSV format');
  R.slice(1).forEach(r=>{const code=r[iC]||'';put(M,r[iE],code,!!code&&code!=='OWID_WRL',+r[iY],num(r[iV]),slot)});
}
function fromWB(J,M,slot){
  if(!Array.isArray(J)||!Array.isArray(J[1])){const msg=J&&J[0]&&J[0].message;throw new Error('World Bank API: '+(msg?JSON.stringify(msg):'no data'))}
  J[1].forEach(o=>{const iso=o.countryiso3code||'';put(M,o.country&&o.country.value,iso,!!I32[iso],+o.date,num(o.value),slot)});
}
/* KOF / generic wide-or-long table (array of arrays) */
function fromTable(R,M,def){
  let hi=R.findIndex(r=>r.some(x=>/^year$/i.test(String(x).trim())));if(hi<0)throw new Error(T[lang].badFile);
  const h=R[hi].map(x=>String(x).trim());const lh=h.map(x=>x.toLowerCase());
  const iY=lh.indexOf('year'),iC=lh.findIndex(x=>['code','iso3','iso','countrycode','country code','iso3c'].includes(x)),iN=lh.findIndex(x=>['country','entity','country name','countryname'].includes(x));
  if(iC<0&&iN<0)throw new Error(T[lang].badFile);
  const cols=[];
  if(def.main.col&&h.includes(def.main.col)){cols.push(['main',h.indexOf(def.main.col)]);def.comps.forEach(c=>{if(h.includes(c.k))cols.push([c.k,h.indexOf(c.k)])})}
  else{const iV=lh.findIndex((x,i)=>i!==iY&&i!==iC&&i!==iN&&R.slice(hi+1,hi+30).some(r=>num(r[i])!=null));if(iV<0)throw new Error(T[lang].badFile);cols.push(['main',iV])}
  R.slice(hi+1).forEach(r=>{const code=iC>=0?String(r[iC]||'').trim().toUpperCase():'';const name=iN>=0?r[iN]:code;
    const ct=!!I32[code];cols.forEach(([slot,i])=>put(M,name,code,ct||(!!code&&code.length===3&&!/^(WLD|WORLD)$/.test(code)),+r[iY],num(r[i]),slot))});
}
function toModel(M,def,src){
  const ents=[...M.values()];
  const cnt={};ents.forEach(e=>{if(e.ct&&e.s.main)Object.keys(e.s.main).forEach(y=>cnt[y]=(cnt[y]||0)+1)});
  const years=Object.keys(cnt).map(Number).filter(y=>cnt[y]>=30&&y>=def.y0&&y<=NOW).sort((a,b)=>a-b);
  if(years.length<1)throw new Error(T[lang].noMain);
  const slots=['main',...def.comps.map(c=>c.k)];
  const rows=ents.filter(e=>e.s.main&&years.some(y=>e.s.main[y]!=null)).map(e=>{
    const v={};slots.forEach(s=>{const a=years.map(y=>e.s[s]?e.s[s][y]??null:null);if(a.some(x=>x!=null))v[s]=a});
    return {n:e.n,iso3:e.iso3,c:e.c,ct:e.ct,v}});
  /* computed average of all countries */
  const C=rows.filter(r=>r.ct),avg={};
  slots.forEach(s=>{const a=years.map((y,i)=>{const xs=C.map(r=>r.v[s]&&r.v[s][i]).filter(x=>x!=null);return xs.length>=10?+(xs.reduce((p,q)=>p+q,0)/xs.length).toFixed(4):null});if(a.some(x=>x!=null))avg[s]=a});
  rows.push({n:'__AVG',iso3:'',c:'',ct:false,v:avg,avg:true});
  return {id:def.id,years,rows,src:Object.assign({ts:Date.now(),latest:years.at(-1)},src)};
}
async function fetchText(url,ms=40000){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal,cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}
  catch(e){throw new Error(e.name==='AbortError'?'timeout':e.message)}
  finally{clearTimeout(tm)}
}
async function loadSlot(spec,M,slot){
  const txt=await fetchText(spec.u);
  if(spec.t==='owid')fromOWID(parseCSV(txt),M,slot);else fromWB(JSON.parse(txt),M,slot);
}
async function fetchIndex(id){
  const def=IDX[id];if(def.main.t==='file')throw new Error(T[lang].needFile);
  const M=new Map();
  try{await loadSlot(def.main,M,'main')}catch(e){throw new Error(srcHost(def.main.u)+': '+e.message)}
  const res=await Promise.allSettled(def.comps.map(c=>loadSlot(c,M,c.k)));
  const m=toModel(M,def,{via:def.main.t});
  m.src.compFail=def.comps.filter((c,i)=>res[i].status==='rejected').map(c=>c.k);
  return m;
}
const srcHost=u=>{try{return new URL(u).host}catch(e){return u}};
async function readFile(file,def){
  const M=new Map(),name=file.name.toLowerCase();
  if(/\.xlsx?$/.test(name)){
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let done=false,err;
    for(const sn of wb.SheetNames){try{fromTable(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),M,def);done=true;break}catch(e){err=e}}
    if(!done)throw err;
  }else{
    const txt=await file.text(),s=txt.trim();
    if(s[0]==='['||s[0]==='{')fromWB(JSON.parse(s),M,'main');
    else{const R=parseCSV(s),h=R[0].map(x=>x.toLowerCase().trim());
      if(h.includes('entity')&&h.includes('year'))fromOWID(R,M,'main');else fromTable(R,M,def)}
  }
  return toModel(M,def,{via:'file',file:file.name});
}

const savePrefs=()=>store.set(PK,prefs);
const keyOf=d=>d.ct?(d.iso3||d.n):'G:'+d.n;
function pickYears(all){
  const last=all.at(-1);
  if(prefs.ym==='all'||all.length<=10)return all.slice();
  if(prefs.ym==='five')return all.filter((y,i)=>i===0||y%5===0||y===last);
  const s=new Set([all[0],...all.filter(y=>y%10===0),...all.slice(-5)]);
  return all.filter(y=>s.has(y));
}
const better=(a,b,hb)=>hb?a>b:a<b;
function applyModel(m){
  MODEL=m;
  if(!m){D=[];YRS=[];sel=[];AVG=null;NC=0;COMPY=[];return}
  YRS=pickYears(m.years);YI=YRS.map(y=>m.years.indexOf(y));L=YRS.length-1;FY=YRS[0];LY=YRS[L];
  const n=m.years.length,li=n-1;
  D=m.rows.map(r=>({n:r.n,iso3:r.iso3,c:r.c,ct:r.ct,avg:!!r.avg,all:r.v.main||Array(n).fill(null),v:YI.map(i=>(r.v.main||[])[i]??null),cp:Object.fromEntries(DEF.comps.map(c=>[c.k,r.v[c.k]||Array(n).fill(null)]))}));
  /* rank + percentile (countries only) for latest year */
  const C=D.filter(d=>d.ct&&d.all[li]!=null);const rd=x=>+x.toFixed(DEF.dec);
  const s=[...C].sort((a,b)=>DEF.hb?b.all[li]-a.all[li]:a.all[li]-b.all[li]);
  s.forEach((d,i)=>{d.rk=i&&rd(s[i-1].all[li])===rd(d.all[li])?s[i-1].rk:i+1});
  C.forEach(d=>{const w=C.filter(o=>better(rd(d.all[li]),rd(o.all[li]),DEF.hb)).length;d.pct=C.length>1?Math.round(w/(C.length-1)*100):null});
  NC=C.length;AVG=D.find(d=>d.avg)||null;
  COMPY=DEF.comps.length?m.years.filter((y,i)=>DEF.comps.some(c=>D.filter(d=>d.ct&&d.cp[c.k][i]!=null).length>=30)).reverse():[];
  if(!COMPY.includes(cyear))cyear=COMPY[0]??null;
  sel=selKeys.map(k=>D.find(d=>keyOf(d)===k)).filter(Boolean);
}
const compIdx=()=>MODEL?MODEL.years.indexOf(cyear):-1;
const hasComp=()=>COMPY.length>0;
async function update(force){
  const id=CUR,tok=++loadTok;if(IDX[id].main.t==='file'){renderStatus();return}
  busy++;status={k:'load'};renderStatus();
  const prevLatest=MODEL&&MODEL.id===id?MODEL.src.latest:0;
  try{
    const m=await fetchIndex(id);store.set(CK(id),m);
    if(tok!==loadTok||id!==CUR)return;
    applyModel(m);status={k:'ok',nw:prevLatest&&m.src.latest>prevLatest?m.src.latest:0};renderAll();
  }catch(e){if(tok!==loadTok||id!==CUR)return;status={k:MODEL?'cache':'none',err:e.message};renderStatus()}
  finally{busy--;renderStatus()}
}
function switchIndex(id){
  if(!IDX[id])return;selKeys=sel.map(keyOf).length?sel.map(keyOf):selKeys;
  CUR=id;DEF=IDX[id];prefs.idx=id;savePrefs();history.replaceState(null,'','#idx='+id);
  LS={};cyear=null;loadTok++;$('dd').style.display='none';$('q').blur();
  const c=store.get(CK(id));applyModel(c&&c.years&&c.rows?c:null);
  status={k:MODEL?'cache':'none'};renderAll();
  if(DEF.main.t!=='file'&&(!MODEL||Date.now()-(MODEL.src.ts||0)>MAX_AGE))update(false);
}

/* ---------- search ---------- */
let hl=0,matches=[];
function search(){
  const q=$('q').value.trim().toLowerCase();
  const sc=d=>{const a=[nm(d,'th').toLowerCase(),nm(d,'en').toLowerCase(),(d.c||'').toLowerCase(),(d.iso3||'').toLowerCase()];
    if(!q)return 1;if(a.some(s=>s.startsWith(q)))return 0;if(a.some(s=>s.split(/[\s(),-]+/).some(w=>w.startsWith(q))))return 1;if(a.some(s=>s.includes(q)))return 2;return 9};
  matches=D.map(d=>[sc(d)+(d.ct?0:.5),d]).filter(x=>x[0]<9||!q).sort((a,b)=>a[0]-b[0]||nm(a[1]).localeCompare(nm(b[1]),lang)).map(x=>x[1]);
  hl=0;drawDD();
}
function drawDD(){
  const dd=$('dd');dd.style.display='block';dd.innerHTML=matches.length?'':`<div>${t('nf')}</div>`;
  matches.forEach((d,i)=>{const e=document.createElement('div');e.className=(sel.includes(d)?'on ':'')+(i===hl?'hl':'');
    e.innerHTML=`<span>${sel.includes(d)?'✓ ':''}${esc(nm(d))}</span><small>${esc(lang==='th'?nm(d,'en'):nm(d,'th'))}${d.ct?'':' · '+t('grp')}</small>`;
    e.onmousedown=ev=>{ev.preventDefault();toggle(d)};dd.appendChild(e)});
}
function toggle(d){sel=sel.includes(d)?sel.filter(x=>x!==d):[...sel,d];selKeys=sel.map(keyOf);refresh();drawDD()}
$('q').addEventListener('input',search);$('q').addEventListener('focus',search);
$('q').addEventListener('blur',()=>$('dd').style.display='none');
$('q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){hl=Math.min(hl+1,matches.length-1);drawDD();$('dd').children[hl]?.scrollIntoView({block:'nearest'})}
  else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);drawDD();$('dd').children[hl]?.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'&&matches[hl])toggle(matches[hl]);else if(e.key==='Escape')$('dd').style.display='none'});

function pctOf(d,arrKey,i,hb){ /* percentile of entity d for slot at year index i */
  const get=x=>arrKey==='main'?x.all[i]:x.cp[arrKey][i];const v=get(d);if(v==null)return null;
  const C=D.filter(x=>x.ct&&get(x)!=null);if(C.length<2)return null;
  return Math.round(C.filter(x=>better(v,get(x),hb)).length/(C.length-1)*100);
}
function rows(){
  const dec=DEF.dec,R=[];

  R.push({l:t('rChg'),v:sel.map(d=>d.v[0]!=null&&d.v[L]!=null?+(d.v[L]-d.v[0]).toFixed(dec+1):null),f:v=>(v>0?'+':'')+v.toFixed(dec+1),b:1,hb:DEF.hb});

}

  if(YRS.length>=3)card('radar','c6',T_,2,{type:'radar',data:{labels:YRS,datasets:ds(d=>d.v,{backgroundColor:undefined,fill:false,pointRadius:3})},options:{scales:{r:{...mm}}}});
  const sc=ds(d=>[{x:d.v[0],y:d.v[L]}],{pointRadius:7,pointHoverRadius:9,showLine:false});sc.forEach(s=>s.backgroundColor=s.borderColor);
  card('scatter','c7',B,1,{type:'scatter',data:{datasets:[...sc,{label:'y = x',type:'line',data:[{x:DEF.min,y:DEF.min},{x:DEF.max,y:DEF.max}],borderDash:[6,5],borderColor:'#999',pointRadius:0,nolabel:true}]},options:{scales:{x:{...mm,title:{display:true,text:nmIdx()+' '+FY}},y:{...mm,title:{display:true,text:nmIdx()+' '+LY}}}}},(v,d)=>d.label);
  card('gap','c8',T_,2,{type:'line',data:{labels:YRS,datasets:ds(d=>d.v.map((x,i)=>x!=null&&AVG&&AVG.v[i]!=null?+(x-AVG.v[i]).toFixed(dec+1):null),line)}},sgn(dec+1));
  /* ----- related / component indicators ----- */
  if(!hasComp()){note(t('c9')[0],t('noComp'));return}
  const ci=compIdx(),li=MODEL.years.indexOf(cyear);
  const axes=[['main',DEF.hb],...DEF.comps.map(c=>[c.k,c.hb])];
  card('pct','c9',B,1,{type:'radar',data:{labels:axes.map(([k])=>cName(k).replace(/\s*\(.*\)$/,'')),datasets:ds(d=>axes.map(([k,hb])=>pctOf(d,k,li,hb)),{backgroundColor:undefined,fill:false,pointRadius:4,borderWidth:2.5})},options:{scales:{r:{min:0,max:100,ticks:{stepSize:20}}}}},v=>v.toFixed(0));
  const IO=DEF.comps.map(c=>[c.k,c[lang]]);
  const k1=LS.k1&&DEF.comps.some(c=>c.k===LS.k1)?LS.k1:DEF.comps[0].k,c1=DEF.comps.find(c=>c.k===k1);
  card('ctrend','c10',T_,2,{type:'line',data:{labels:YRS,datasets:ds(d=>YI.map(i=>d.cp[k1][i]),line)},options:{scales:{y:{title:{display:true,text:c1[lang]}}}}},v=>v.toFixed(c1.dec),{o:IO,v:k1,on:v=>{LS.k1=v;renderCharts()}});
  const k2=LS.k2&&DEF.comps.some(c=>c.k===LS.k2)?LS.k2:DEF.comps[0].k,c2=DEF.comps.find(c=>c.k===k2);
  const sv=sel.map((d,i)=>({i,v:d.cp[k2][ci]})).sort((a,b)=>(a.v==null)-(b.v==null)||(c2.hb?b.v-a.v:a.v-b.v));
  card('cbar','c11',B,1,{type:'bar',data:{labels:sv.map(z=>N[z.i]),datasets:[{label:c2[lang],data:sv.map(z=>z.v),backgroundColor:sv.map(z=>col(z.i,.8))}]},options:{indexAxis:hz?'y':'x',plugins:{legend:{display:false}},scales:{[vAx]:{min:c2.min,max:c2.max,title:{display:true,text:c2[lang]}}}}},v=>v.toFixed(c2.dec),{o:IO,v:k2,on:v=>{LS.k2=v;renderCharts()}});
}

/* ---------- chrome ---------- */
function chips(){$('chips').innerHTML='';sel.forEach(d=>{const e=document.createElement('span');e.className='chip';e.innerHTML=`${esc(nm(d))}<b title="✕">✕</b>`;e.querySelector('b').onclick=()=>toggle(d);$('chips').appendChild(e)})}
function refresh(){chips();renderTable();renderCharts();$('srcnote').textContent=MODEL?t('src'):''}
function renderAll(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('bch').textContent=t(show?'hideCh':'showCh');$('q').placeholder=t('ph');
  $('bth').classList.toggle('on',lang==='th');$('ben').classList.toggle('on',lang==='en');
  renderPicker();dataPanel();refresh();
}
$('bth').onclick=()=>{lang='th';renderAll()};$('ben').onclick=()=>{lang='en';renderAll()};
$('bch').onclick=()=>{show=!show;$('bch').textContent=t(show?'hideCh':'showCh');renderCharts();if(show&&sel.length)$('charts').scrollIntoView({behavior:'smooth'})};
$('brs').onclick=()=>{sel=[];selKeys=[];LS={};$('q').value='';$('dd').style.display='none';refresh()};
window.addEventListener('hashchange',()=>{const h=(location.hash.match(/idx=(\w+)/)||[])[1];if(IDX[h]&&h!==CUR)switchIndex(h)});

/* ---------- start ---------- */
selKeys=['THA'];
switchIndex(CUR);
setInterval(()=>{if(!document.hidden)update(false)},POLL);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&MODEL&&Date.now()-(MODEL.src.ts||0)>POLL)update(false)});
</script>
